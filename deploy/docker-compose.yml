services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: {{ INSTALL_IMAGE1 }}
    # image: hub:test
    restart: unless-stopped
    ports:
      # - 127.0.0.1:8080:3000
      - "127.0.0.1:{{ INSTALL_DEPLOY_PORT }}:3000"
    env_file:
      - path: env_file
        required: true
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4096M
